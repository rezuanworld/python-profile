<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Python Journey</title>
<style>
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:#080b10;color:#d9f7e8;font-family:Consolas,Monaco,monospace;display:flex;align-items:center;justify-content:center;overflow:hidden}
.bg{position:fixed;inset:0;background:radial-gradient(circle at 50% 45%,#123524 0%,#080b10 55%);opacity:.75}
.card{position:relative;width:min(900px,92vw);padding:42px 34px;border:1px solid #1f8f5b;border-radius:22px;background:rgba(5,12,9,.82);box-shadow:0 0 50px rgba(36,210,119,.12),inset 0 0 35px rgba(36,210,119,.04);text-align:left}
.badge{color:#5ee89a;font-size:14px;margin-bottom:22px}
.line{color:#7de7aa}
.prompt{color:#ffd43b}
.cursor{display:inline-block;width:9px;height:20px;background:#5ee89a;vertical-align:middle;animation:blink .8s infinite}
h1{font-size:clamp(34px,7vw,72px);margin:18px 0 8px;color:#fff;letter-spacing:2px}
.sub{color:#8da99a;font-size:clamp(14px,2.2vw,19px);line-height:1.7}
.progress{height:7px;background:#17231d;border-radius:99px;margin:28px 0 10px;overflow:hidden}
.bar{height:100%;width:0;background:#5ee89a;box-shadow:0 0 16px #5ee89a;animation:load 3.2s ease forwards}
.status{font-size:13px;color:#789184}
.python{position:absolute;right:28px;top:24px;font-size:38px;opacity:.08}
@keyframes blink{50%{opacity:0}}
@keyframes load{to{width:100%}}
@media(max-width:600px){.card{padding:30px 22px}.python{display:none}}
</style>
</head>
<body>
<div class="bg"></div>
<main class="card">
<div class="python">🐍</div>
<div class="badge">PYTHON // PERSONAL PROFILE</div>
<div class="line"><span class="prompt">>>></span> print(<span style="color:#f2a9ff">"Hello, World!"</span>)</div>
<h1 id="title"></h1>
<div class="sub" id="sub"></div>
<div class="progress"><div class="bar"></div></div>
<div class="status" id="status">Initializing Python journey...</div>
</main>
<script>
const title="Python Journey";
const subtitle="Learning today. Building tomorrow.";
let i=0,j=0;
function typeTitle(){
 if(i<title.length){document.getElementById("title").textContent+=title[i++];setTimeout(typeTitle,90)}
 else typeSub();
}
function typeSub(){
 const t=subtitle;
 if(j<t.length){document.getElementById("sub").textContent+=t[j++];setTimeout(typeSub,48)}
 else setTimeout(()=>document.getElementById("status").textContent="✓ Python environment ready — let's build something.",3300);
}
typeTitle();
</script>
</body>
</html>
